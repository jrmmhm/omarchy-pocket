<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880"
     role="img" aria-labelledby="t d">
  <title id="t">Where a grouped widget's entry lives</title>
  <desc id="d">Other grouping widgets move the entry into the top-level plugins array, which
    keeps it reported as enabled while taking it off the bar. Pocket leaves the entry in
    bar.layout and only flips the slot's visibility.</desc>

  <!-- Palette. Two accents, and depth from opacity rather than more colours.
       The media query is the common case; the opaque paper underneath is what
       keeps the figure legible when a renderer resolves the query the other
       way, which an <img>-embedded SVG regularly does. Nothing here reads a
       value from the host page: inside an <img> the SVG is its own document,
       and a CSS variable defined out there never arrives. -->
  <style>
    .paper { fill: #0d1117 }
    .panel { fill: #161b22 }
    .line  { fill: none; stroke: #30363d; stroke-width: 1 }
    .ink   { fill: #c9d1d9 }
    .mute  { fill: #8b949e }
    .warn  { fill: #d29922; color: #d29922 }
    .good  { fill: #3fb950 }
    .wire  { fill: none; stroke: currentColor; stroke-width: 1.5 }
    @media (prefers-color-scheme: light) {
      .paper { fill: #ffffff }
      .panel { fill: #f6f8fa }
      .line  { stroke: #d0d7de }
      .ink   { fill: #1f2328 }
      .mute  { fill: #59636e }
      .warn  { fill: #9a6700; color: #9a6700 }
      .good  { fill: #1a7f37 }
    }
    .eyebrow { font: 600 10.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
               letter-spacing: .12em }
    .code    { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .verdict { font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif }
    .aside   { font: 400 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif }
  </style>

  <rect class="paper" width="880" height="296" rx="12"/>

  <!-- Left: the entry is moved out -->
  <text x="40" y="46" class="eyebrow mute">EVERY OTHER WAY OF GROUPING</text>

  <rect x="40" y="64" width="360" height="56" rx="8" class="panel"/>
  <rect x="40" y="64" width="360" height="56" rx="8" class="line"/>
  <text x="60" y="88" class="code mute">bar.layout.right</text>
  <text x="60" y="108" class="code ink">[ tray, group, … ]</text>

  <!-- The arrow is drawn rather than marked up. A <marker> would keep one
       definition for many arrows; there is exactly one here, and `orient` plus
       marker units render differently across the renderers a README passes
       through. Both halves take `currentColor` from the group, so the tip can
       never end up a different colour from its line. -->
  <g class="warn">
    <path d="M220 126v22" class="wire"/>
    <path d="M214.5 147 220 157l5.5-10z" fill="currentColor"/>
  </g>
  <text x="238" y="150" class="aside mute">the widget's entry is moved</text>

  <rect x="40" y="164" width="360" height="56" rx="8" class="panel"/>
  <rect x="40" y="164" width="360" height="56" rx="8" class="line"/>
  <text x="60" y="188" class="code mute">plugins[]</text>
  <text x="60" y="208" class="code ink">[ darky, omaplug, tailscale ]</text>

  <text x="40" y="252" class="verdict warn">Still reported enabled — and no longer on the bar</text>
  <text x="40" y="272" class="aside mute">the split is what breaks: no slot to toggle, settings in another file</text>

  <!-- Divider -->
  <path d="M440 40v216" class="line"/>

  <!-- Right: the entry stays put -->
  <text x="480" y="46" class="eyebrow mute">POCKET</text>

  <rect x="480" y="64" width="360" height="156" rx="8" class="panel"/>
  <rect x="480" y="64" width="360" height="156" rx="8" class="line"/>
  <text x="500" y="88" class="code mute">bar.layout.right</text>
  <text x="500" y="112" class="code ink">[ tray, darky, omaplug,</text>
  <text x="500" y="132" class="code ink">  tailscale, pocket, … ]</text>
  <text x="500" y="176" class="code mute">slot.visible = false</text>
  <text x="500" y="200" class="aside mute">the only thing Pocket changes</text>

  <text x="480" y="252" class="verdict good">One entry, where every tool already looks</text>
  <text x="480" y="272" class="aside mute">nothing is moved, so nothing else in the shell notices</text>
</svg>
