<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" role="img"
     aria-label="Three states of an Omarchy bar: crowded without Pocket, tucked away with a collapsed Pocket, and fanned back out on hover.">
  <defs>
    <style>
      .card  { fill: #0f1319; }
      .bar   { fill: #1a1f27; }
      .edge  { fill: none; stroke: #2b323d; stroke-width: 1; }
      .ico   { fill: none; stroke: #9aa7b6; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .dim   { stroke: #566170; }
      .lbl   { fill: #6e7a8a; font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .10em; }
      .note  { fill: #8b98a8; font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .accent{ stroke: #58a6ff; }
      .afill { fill: #58a6ff; }
      .halo  { fill: #58a6ff; opacity: .10; }
    </style>

    <g id="i-clock"><circle cx="0" cy="0" r="7.5" class="ico"/><path d="M0 -4.2V0l3 2.4" class="ico"/></g>
    <g id="i-net"><path d="M-7.5 -2.2a11 11 0 0 1 15 0M-4.4 1.4a6.6 6.6 0 0 1 8.8 0" class="ico"/><circle cx="0" cy="5.2" r="1.3" fill="#9aa7b6"/></g>
    <g id="i-vol"><path d="M-6.5 -3h3.4L1 -7v14l-4.1-4h-3.4z" class="ico"/><path d="M4 -3.2a5 5 0 0 1 0 6.4" class="ico"/></g>
    <g id="i-batt"><rect x="-8" y="-4.6" width="14" height="9.2" rx="2.2" class="ico"/><path d="M8 -1.8v3.6" class="ico"/></g>
    <g id="i-bt"><path d="M-3.6 -4.6 3.8 2.6-.4 6.6v-13.4l4.2 4L-3.6 6.6" class="ico"/></g>
    <g id="i-cpu"><rect x="-6" y="-6" width="12" height="12" rx="2.4" class="ico"/><path d="M-2.6 -9v3M2.6 -9v3M-2.6 9v-3M2.6 9v-3M-9 -2.6h3M-9 2.6h3M9 -2.6h-3M9 2.6h-3" class="ico"/></g>
    <g id="i-box"><rect x="-6.4" y="-6.4" width="12.8" height="12.8" rx="2.6" class="ico"/><path d="M-2.8 0h5.6" class="ico"/></g>
    <g id="i-moon"><path d="M4.4 3.4A7.4 7.4 0 0 1-3.6 -6a7.6 7.6 0 1 0 8 9.4z" class="ico"/></g>
    <g id="i-cam"><rect x="-7.4" y="-5" width="14.8" height="10" rx="2.4" class="ico"/><circle cx="0" cy="0" r="2.6" class="ico"/></g>
    <g id="i-pin"><path d="M0 7v-5" class="ico"/><path d="M-4.6 -6.6h9.2l-1.6 6.2h-6z" class="ico"/></g>
    <g id="i-menu"><path d="M-6.4 -4h12.8M-6.4 0h12.8M-6.4 4h12.8" class="ico"/></g>
    <g id="i-up"><path d="M0 6.4v-11" class="ico"/><path d="M-4.4 -0.6 0 -5.2l4.4 4.6" class="ico"/></g>

    <g id="dots"><circle cx="0" cy="-5.4" r="1.9"/><circle cx="0" cy="0" r="1.9"/><circle cx="0" cy="5.4" r="1.9"/></g>
  </defs>

  <rect width="880" height="330" rx="12" class="card"/>

  <!-- 1: without -->
  <text x="28" y="52" class="lbl">WITHOUT</text>
  <text x="28" y="70" class="note">twelve marks, none read</text>
  <rect x="232" y="30" width="620" height="38" rx="9" class="bar"/>
  <rect x="232" y="30" width="620" height="38" rx="9" class="edge"/>
  <g transform="translate(268,49)"><use href="#i-menu"/></g>
  <g transform="translate(306,49)"><use href="#i-clock"/></g>
  <g transform="translate(560,49)"><use href="#i-moon"/></g>
  <g transform="translate(596,49)"><use href="#i-cam"/></g>
  <g transform="translate(632,49)"><use href="#i-box"/></g>
  <g transform="translate(668,49)"><use href="#i-pin"/></g>
  <g transform="translate(704,49)"><use href="#i-bt"/></g>
  <g transform="translate(740,49)"><use href="#i-net"/></g>
  <g transform="translate(776,49)"><use href="#i-vol"/></g>
  <g transform="translate(812,49)"><use href="#i-batt"/></g>

  <!-- 2: collapsed -->
  <text x="28" y="172" class="lbl">POCKETED</text>
  <text x="28" y="190" class="note">four of them, behind one mark</text>
  <rect x="232" y="150" width="620" height="38" rx="9" class="bar"/>
  <rect x="232" y="150" width="620" height="38" rx="9" class="edge"/>
  <g transform="translate(268,169)"><use href="#i-menu"/></g>
  <g transform="translate(306,169)"><use href="#i-clock"/></g>
  <g transform="translate(668,169)" fill="#9aa7b6"><use href="#dots"/></g>
  <g transform="translate(704,169)"><use href="#i-bt"/></g>
  <g transform="translate(740,169)"><use href="#i-net"/></g>
  <g transform="translate(776,169)"><use href="#i-vol"/></g>
  <g transform="translate(812,169)"><use href="#i-batt"/></g>

  <!-- 3: hovered -->
  <text x="28" y="292" class="lbl">ON HOVER</text>
  <text x="28" y="310" class="note">the same widgets, still live</text>
  <rect x="232" y="270" width="620" height="38" rx="9" class="bar"/>
  <rect x="232" y="270" width="620" height="38" rx="9" class="edge"/>
  <rect x="512" y="276" width="180" height="26" rx="7" class="halo"/>
  <g transform="translate(268,289)"><use href="#i-menu"/></g>
  <g transform="translate(306,289)"><use href="#i-clock"/></g>
  <g transform="translate(524,289)"><use href="#i-moon"/></g>
  <g transform="translate(560,289)"><use href="#i-cam"/></g>
  <g transform="translate(596,289)"><use href="#i-box"/></g>
  <g transform="translate(632,289)"><use href="#i-pin"/></g>
  <g transform="translate(668,289) rotate(90)" class="afill"><use href="#dots"/></g>
  <g transform="translate(704,289)"><use href="#i-bt"/></g>
  <g transform="translate(740,289)"><use href="#i-net"/></g>
  <g transform="translate(776,289)"><use href="#i-vol"/></g>
  <g transform="translate(812,289)"><use href="#i-batt"/></g>
</svg>
