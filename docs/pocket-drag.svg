<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" role="img"
     aria-label="Two gestures: dragging a widget onto the Pocket puts it away; dragging a member past the Pocket takes it back out.">
  <defs>
    <style>
      .card  { fill: #0f1319; }
      .pane  { fill: #131820; }
      .bar   { fill: #1a1f27; }
      .edge  { fill: none; stroke: #2b323d; stroke-width: 1; }
      .ico   { fill: none; stroke: #9aa7b6; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ghost { opacity: .38; }
      .lbl   { fill: #cdd9e5; font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .note  { fill: #7d8b9b; font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .path  { fill: none; stroke: #58a6ff; stroke-width: 1.7; stroke-dasharray: 4 4; stroke-linecap: round; }
      .afill { fill: #58a6ff; }
      .halo  { fill: #58a6ff; opacity: .13; }
      .mark  { fill: #58a6ff; }
    </style>

    <g id="d-bt"><path d="M-3.6 -4.6 3.8 2.6-.4 6.6v-13.4l4.2 4L-3.6 6.6" class="ico"/></g>
    <g id="d-moon"><path d="M4.4 3.4A7.4 7.4 0 0 1-3.6 -6a7.6 7.6 0 1 0 8 9.4z" class="ico"/></g>
    <g id="d-box"><rect x="-6.4" y="-6.4" width="12.8" height="12.8" rx="2.6" class="ico"/><path d="M-2.8 0h5.6" class="ico"/></g>
    <g id="d-pin"><path d="M0 7v-5" class="ico"/><path d="M-4.6 -6.6h9.2l-1.6 6.2h-6z" class="ico"/></g>
    <g id="d-net"><path d="M-7.5 -2.2a11 11 0 0 1 15 0M-4.4 1.4a6.6 6.6 0 0 1 8.8 0" class="ico"/><circle cx="0" cy="5.2" r="1.3" fill="#9aa7b6"/></g>
    <g id="d-dots"><circle cx="0" cy="-5.4" r="1.9"/><circle cx="0" cy="0" r="1.9"/><circle cx="0" cy="5.4" r="1.9"/></g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 9 5 0 9z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="880" height="250" rx="12" class="card"/>

  <!-- left: put it away -->
  <rect x="24" y="24" width="404" height="202" rx="10" class="pane"/>
  <text x="48" y="56" class="lbl">Drop it on the dots</text>
  <text x="48" y="76" class="note">from either side — they light up first</text>

  <rect x="48" y="150" width="356" height="38" rx="9" class="bar"/>
  <rect x="48" y="150" width="356" height="38" rx="9" class="edge"/>
  <g transform="translate(84,169)"><use href="#d-moon"/></g>
  <g transform="translate(120,169)"><use href="#d-box"/></g>
  <g transform="translate(156,169)"><use href="#d-pin"/></g>
  <rect x="177" y="156" width="26" height="26" rx="7" class="halo"/>
  <g transform="translate(190,169) rotate(0)" class="afill"><use href="#d-dots"/></g>
  <g transform="translate(300,169)" class="ghost"><use href="#d-bt"/></g>
  <g transform="translate(348,169)"><use href="#d-net"/></g>

  <!-- the drop marker the bar itself draws -->
  <rect x="176" y="154" width="2.5" height="30" rx="1.2" class="mark"/>
  <path d="M292 152 C 262 118, 214 122, 186 146" class="path" marker-end="url(#arrow)"/>
  <g transform="translate(292,140)"><use href="#d-bt"/></g>

  <!-- right: get it back -->
  <rect x="452" y="24" width="404" height="202" rx="10" class="pane"/>
  <text x="476" y="56" class="lbl">Drag it past them</text>
  <text x="476" y="76" class="note">out of the group, back onto the bar</text>

  <rect x="476" y="150" width="356" height="38" rx="9" class="bar"/>
  <rect x="476" y="150" width="356" height="38" rx="9" class="edge"/>
  <g transform="translate(512,169)"><use href="#d-moon"/></g>
  <g transform="translate(548,169)"><use href="#d-box"/></g>
  <g transform="translate(584,169)" class="ghost"><use href="#d-pin"/></g>
  <g transform="translate(620,169) rotate(90)" fill="#9aa7b6"><use href="#d-dots"/></g>
  <g transform="translate(700,169)"><use href="#d-bt"/></g>
  <g transform="translate(796,169)"><use href="#d-net"/></g>

  <rect x="757" y="154" width="2.5" height="30" rx="1.2" class="mark"/>
  <path d="M590 142 C 640 108, 716 112, 754 144" class="path" marker-end="url(#arrow)"/>
  <g transform="translate(586,132)"><use href="#d-pin"/></g>
</svg>
